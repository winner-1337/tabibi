<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabibi — Votre cabinet, simplifié</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      html, body { margin: 0; min-width: 320px; min-height: 100%; background: #f5f7f9; }
      .boot-fallback { min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 12px; color: #29404b; font-family: Arial, sans-serif; text-align: center; }
      .boot-fallback-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: white; background: #1c8a78; font-size: 22px; font-weight: 700; }
      .boot-fallback h1 { margin: 0; font-size: 24px; }
      .boot-fallback p { margin: 0; color: #82919b; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div class="boot-fallback-mark">T</div>
        <h1>Tabibi</h1>
        <p>Chargement de votre espace...</p>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
